name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-format

      - name: Check C++ formatting
        run: ./format.sh --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cpplint
        run: python -m pip install cpplint

      - name: Run cpplint
        run: ./lint.sh

  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Boost dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libboost-date-time-dev \
            libboost-regex-dev \
            libboost-test-dev

      - name: Build and run all exercise tests
        run: |
          set -euo pipefail

          for cmake_file in */CMakeLists.txt; do
            [ -f "$cmake_file" ] || continue
            exercise="${cmake_file%/CMakeLists.txt}"
            build_dir="$RUNNER_TEMP/cpp-exercism-build/$exercise"
            cxx_flags="-DCATCH_CONFIG_NO_POSIX_SIGNALS"
            if [[ "$CXX" == "clang++" ]] &&
              printf '' | "$CXX" -Werror -Wc2y-extensions -x c++ -fsyntax-only - >/dev/null 2>&1; then
              cxx_flags+=" -Wno-error=c2y-extensions"
            fi

            echo "::group::${exercise}"
            cmake -S "$exercise" -B "$build_dir" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_CXX_FLAGS="$cxx_flags" \
              -DEXERCISM_RUN_ALL_TESTS=ON
            cmake --build "$build_dir" --parallel 2 --target "$exercise"
            "$build_dir/$exercise"
            echo "::endgroup::"
          done
