name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-format

      - name: Check C++ formatting
        run: ./format.sh --check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cpplint
        run: python -m pip install cpplint

      - name: Run cpplint
        run: ./lint.sh

  test:
    name: Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - g++
          - clang++
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Boost dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libboost-date-time-dev \
            libboost-regex-dev \
            libboost-test-dev

      - name: Build and run all exercise tests
        run: ./ci-test.sh
